  <script>
  // ============================================================
  //  CONTROLE FINANCEIRO — módulo completo
  // ============================================================
  
  // Estado do módulo
  const fin = {
    lancamentos: [],        // todos os lançamentos carregados
    gerencial: null,        // dados do DRE
    categorias: [],         // lista de categorias únicas
    chartBar: null,
    chartDonut: null,
    sheetId: null,          // será preenchido com o financeiroSheetId do cliente
    initialized: false
  };

  // Mapeamento de prefixos para grupos do DRE
  const GRUPOS_DRE = {
    'R -': 'Rendas',
    'C -': 'Casa',
    'A -': 'Alimentação',
    'S -': 'Saúde',
    'T -': 'Transporte',
    'L -': 'Lazer / Streaming',
    'E -': 'Viagens',
    'P -': 'Pessoal',
    'F -': 'Financeiro',
    'I -': 'Investimentos / Aportes',
    'X -': 'Outros'
  };

  function getGrupo(ref) {
    if (!ref) return 'Outros';
    const prefix = ref.substring(0, 3);
    return GRUPOS_DRE[prefix] || 'Outros';
  }

  function isRenda(ref) {
    return ref && ref.startsWith('R -');
  }

  // Inicialização — chamada ao navegar para a aba
  async function initFinanceiro() {
    if (fin.initialized) return;
    fin.initialized = true;
    // Usa o mesmo spreadsheetId do resumo como base; 
    // a planilha de controle financeiro é identificada via Supabase (coluna financeiro_sheet_id)
    // Por enquanto reutiliza resumoSheetId se financeiroSheetId não estiver definido
    fin.sheetId = window.financeiroSheetId || resumoSheetId;
    setCurrentMonth();
  }

  function setCurrentMonth() {
    const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
                   'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    const now = new Date();
    const mes = meses[now.getMonth()];
    const ano = now.getFullYear().toString();
    const selMes = document.getElementById('fin-filtro-mes');
    const selAno = document.getElementById('fin-filtro-ano');
    const selRelMes = document.getElementById('fin-rel-mes');
    if (selMes) selMes.value = mes;
    if (selAno) { selAno.value = ano; if (!selAno.querySelector(`option[value="${ano}"]`)) selAno.value = '2025'; }
    if (selRelMes) selRelMes.value = mes;
    document.getElementById('nl-mes').value = mes;
  }

  // ──────────────────────────────────────────────
  //  ABA 1: LANÇAMENTOS
  // ──────────────────────────────────────────────
  async function loadLancamentos() {
    const sheetId = fin.sheetId;
    if (!sheetId) { alert('Planilha não encontrada. Verifique a configuração do cliente.'); return; }
    
    document.getElementById('fin-lancamentos-loading').style.display = 'block';
    document.getElementById('fin-tbody-lancamentos').innerHTML = '';
    
    try {
      const resp = await gapi.client.sheets.spreadsheets.values.get({
        spreadsheetId: sheetId,
        range: "Lançamentos!A:H"
      });
      
      const rows = resp.result.values || [];
      // Pula as 2 primeiras linhas (título + cabeçalho)
      const dataRows = rows.slice(2).filter(r => r && r[0] && r[4] !== undefined);
      
      fin.lancamentos = dataRows.map(r => ({
        mes: r[0] || '',
        ano: r[1] ? parseInt(r[1]) : null,
        origem: r[2] || '',
        referencia: r[3] || '',
        valor: r[4] ? parseFloat(r[4]) : 0,
        data: r[5] || '',
        extrato: r[6] || '',
        obs: r[7] || ''
      })).filter(r => r.mes && r.mes !== 'MÊS');
      
      // Extrai categorias únicas para o select do modal
      const cats = [...new Set(fin.lancamentos.map(l => l.referencia).filter(Boolean))].sort();
      fin.categorias = cats;
      const sel = document.getElementById('nl-referencia');
      sel.innerHTML = '<option value="">Selecione...</option>' + cats.map(c => `<option value="${c}">${c}</option>`).join('');
      
      filtrarLancamentos();
    } catch(e) {
      console.error('Erro ao carregar lançamentos:', e);
      document.getElementById('fin-tbody-lancamentos').innerHTML = 
        `<tr><td colspan="6" class="empty-state">Erro ao carregar: ${e.message || e.result?.error?.message || 'Verifique o ID da planilha e as permissões.'}</td></tr>`;
    } finally {
      document.getElementById('fin-lancamentos-loading').style.display = 'none';
    }
  }

  function filtrarLancamentos() {
    const mes = document.getElementById('fin-filtro-mes').value;
    const ano = document.getElementById('fin-filtro-ano').value;
    const tipo = document.getElementById('fin-filtro-tipo').value;
    
    let dados = fin.lancamentos;
    if (mes) dados = dados.filter(l => l.mes === mes);
    if (ano) dados = dados.filter(l => l.ano === parseInt(ano));
    if (tipo === 'entrada') dados = dados.filter(l => l.valor > 0);
    if (tipo === 'saida') dados = dados.filter(l => l.valor < 0);
    
    renderTabelaLancamentos(dados);
  }

  function renderTabelaLancamentos(dados) {
    const tbody = document.getElementById('fin-tbody-lancamentos');
    
    if (!dados.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Nenhum lançamento encontrado para os filtros aplicados.</td></tr>';
      document.getElementById('fin-total-entradas').textContent = 'R$ 0,00';
      document.getElementById('fin-total-saidas').textContent = 'R$ 0,00';
      document.getElementById('fin-total-saldo').textContent = 'R$ 0,00';
      document.getElementById('fin-count-label').textContent = '0 registros';
      return;
    }
    
    const entradas = dados.filter(l => l.valor > 0).reduce((s, l) => s + l.valor, 0);
    const saidas = dados.filter(l => l.valor < 0).reduce((s, l) => s + l.valor, 0);
    const saldo = entradas + saidas;
    
    document.getElementById('fin-total-entradas').textContent = fmtBRL(entradas);
    document.getElementById('fin-total-saidas').textContent = fmtBRL(saidas);
    document.getElementById('fin-total-saldo').textContent = fmtBRL(saldo);
    document.getElementById('fin-count-label').textContent = `${dados.length} registros`;
    
    // Ordena: mês/ano desc, depois data
    const mesesOrdem = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
                         'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    dados.sort((a, b) => {
      if (a.ano !== b.ano) return (b.ano || 0) - (a.ano || 0);
      return mesesOrdem.indexOf(b.mes) - mesesOrdem.indexOf(a.mes);
    });
    
    tbody.innerHTML = dados.map(l => {
      const valClass = l.valor > 0 ? 'val-pos' : l.valor < 0 ? 'val-neg' : 'val-zero';
      const dataFmt = l.data ? formatDate(l.data) : '—';
      const grupo = getGrupo(l.referencia);
      const grupoBadge = `<span style="font-size:10px;background:var(--cinza-claro);color:var(--text-light);padding:2px 6px;border-radius:10px;margin-left:6px;">${grupo}</span>`;
      return `<tr>
        <td>${l.mes}${l.ano ? ' / ' + l.ano : ''}</td>
        <td style="font-size:12px;color:var(--text-light);">${l.origem}</td>
        <td>${l.referencia || '—'}${grupoBadge}</td>
        <td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${l.extrato}">${l.extrato || '—'}</td>
        <td style="font-size:12px;">${dataFmt}</td>
        <td style="text-align:right;" class="${valClass}">${fmtBRL(l.valor)}</td>
      </tr>`;
    }).join('');
  }

  async function salvarLancamento() {
    const mes = document.getElementById('nl-mes').value;
    const ano = document.getElementById('nl-ano').value;
    const origem = document.getElementById('nl-origem').value.trim();
    const ref = document.getElementById('nl-referencia').value;
    const valor = parseFloat(document.getElementById('nl-valor').value);
    const data = document.getElementById('nl-data').value;
    const extrato = document.getElementById('nl-extrato').value.trim();
    
    if (!mes || !ano || !origem || !ref || isNaN(valor)) {
      alert('Preencha todos os campos obrigatórios (Mês, Ano, Origem, Categoria e Valor).');
      return;
    }
    
    const sheetId = fin.sheetId;
    const dataFmt = data ? new Date(data + 'T12:00:00').toLocaleDateString('pt-BR') : '';
    
    try {
      await gapi.client.sheets.spreadsheets.values.append({
        spreadsheetId: sheetId,
        range: "Lançamentos!A:H",
        valueInputOption: "USER_ENTERED",
        resource: { values: [[mes, parseInt(ano), origem, ref, valor, dataFmt, extrato, '']] }
      });
      
      alert('✅ Lançamento salvo na planilha!');
      closeModal('modal-add-lancamento');
      // Recarrega
      await loadLancamentos();
    } catch(e) {
      alert('Erro ao salvar: ' + (e.result?.error?.message || e.message));
    }
  }

  // ──────────────────────────────────────────────
  //  ABA 2: GERENCIAL / DRE
  // ──────────────────────────────────────────────
  async function loadGerencial() {
    const sheetId = fin.sheetId;
    if (!sheetId) { alert('Planilha não encontrada.'); return; }
    
    document.getElementById('fin-dre-loading').style.display = 'block';
    document.getElementById('fin-dre-container').innerHTML = '';
    
    try {
      // Busca aba Gerencial — as colunas C (categoria) e F:Q (Jan-Dez) + S (total) + T (média)
      const resp = await gapi.client.sheets.spreadsheets.values.get({
        spreadsheetId: sheetId,
        range: "Gerencial!A:AJ"
      });
      
      const rows = resp.result.values || [];
      fin.gerencial = rows;
      renderDRE();
    } catch(e) {
      document.getElementById('fin-dre-container').innerHTML = 
        `<div class="empty-state">Erro ao carregar dados gerenciais: ${e.result?.error?.message || e.message}</div>`;
    } finally {
      document.getElementById('fin-dre-loading').style.display = 'none';
    }
  }

  function renderDRE() {
    const rows = fin.gerencial;
    if (!rows) return;
    const anoSel = parseInt(document.getElementById('fin-dre-ano').value);
    
    // Meses abreviados para header
    const meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    
    // Encontra linha de datas (linha 2, index 1) para mapear colunas do ano selecionado
    // A estrutura tem anos em blocos: 2025 nas colunas F:Q (índices 5-16), 2026 em V:AG (21-32)
    // Linha 1 (index 1) contém as datas, linha 0 tem os anos
    let colStart = 5; // default 2025 = colunas F-Q
    let totalCol = 18; // coluna S
    let mediaCol = 19; // coluna T
    
    // Tenta detectar dinamicamente pelo ano na linha de cabeçalho
    const headerAno = rows[0] || [];
    for (let i = 0; i < headerAno.length; i++) {
      const val = headerAno[i];
      if (val && parseInt(val) === anoSel) { colStart = i; break; }
    }
    totalCol = colStart + 12;
    mediaCol = colStart + 13;
    
    // Constrói estrutura do DRE agrupando por grupo
    const dreStruct = [];
    let currentGroup = null;
    let currentSubgroup = null;
    
    for (let i = 2; i < rows.length; i++) {
      const row = rows[i];
      if (!row) continue;
      
      const col1 = row[1] || ''; // Coluna B: grupo/subgrupo
      const col2 = row[2] || ''; // Coluna C: categoria
      const colD = row[3] || ''; // Coluna D: marcador x
      
      if (!col1 && !col2) continue;
      
      // Linha de grupo principal (col B preenchido, col C vazio, sem 'x' em D, não é subcategoria)
      if (col1 && !col2 && colD !== 'x') {
        currentGroup = { label: col1, subgroups: [], type: 'group', values: getRowValues(row, colStart, totalCol, mediaCol) };
        dreStruct.push(currentGroup);
        currentSubgroup = null;
      } else if (col1 && !col2 && colD === 'x') {
        // Subgrupo (col B com 'x' em D)
        currentSubgroup = { label: col1, items: [], type: 'subgroup', values: getRowValues(row, colStart, totalCol, mediaCol) };
        if (currentGroup) currentGroup.subgroups.push(currentSubgroup);
        else dreStruct.push({ label: '', subgroups: [currentSubgroup], type: 'group', values: [] });
      } else if (col2) {
        // Item de categoria
        const item = { label: col2, type: 'item', values: getRowValues(row, colStart, totalCol, mediaCol) };
        if (currentSubgroup) currentSubgroup.items.push(item);
        else if (currentGroup) {
          if (!currentGroup.subgroups.length) currentGroup.subgroups.push({ label: '', items: [], type: 'subgroup', values: [] });
          currentGroup.subgroups[currentGroup.subgroups.length-1].items.push(item);
        }
      }
    }
    
    // Renderiza tabela
    let html = `<table class="dre-table"><thead><tr>
      <th>Categoria</th>
      ${meses.map(m => `<th>${m}</th>`).join('')}
      <th>Total</th><th>Média</th>
    </tr></thead><tbody>`;
    
    for (const group of dreStruct) {
      if (!group.label) continue;
      const isRendas = group.label.toLowerCase().includes('renda') || group.label.toLowerCase().includes('total de despesa') || group.label.toLowerCase().includes('resultado');
      const rowClass = isRendas ? 'dre-row-total' : 'dre-row-group';
      html += `<tr class="${rowClass}"><td>${group.label}</td>${renderDRECols(group.values, meses.length, isRendas)}</tr>`;
      
      for (const sub of (group.subgroups || [])) {
        if (sub.label) {
          html += `<tr class="dre-row-subgroup"><td style="padding-left:16px;">${sub.label}</td>${renderDRECols(sub.values, meses.length, false)}</tr>`;
        }
        for (const item of (sub.items || [])) {
          html += `<tr class="dre-row-item"><td>${item.label}</td>${renderDRECols(item.values, meses.length, false)}</tr>`;
        }
      }
    }
    
    html += '</tbody></table>';
    document.getElementById('fin-dre-container').innerHTML = html;
  }

  function getRowValues(row, colStart, totalCol, mediaCol) {
    const vals = [];
    for (let c = colStart; c < colStart + 12; c++) {
      vals.push(parseNum(row[c]));
    }
    vals.push(parseNum(row[totalCol]));  // total
    vals.push(parseNum(row[mediaCol]));  // média
    return vals;
  }

  function renderDRECols(values, nMeses, isSummary) {
    if (!values || !values.length) return '<td colspan="14">—</td>';
    let html = '';
    for (let i = 0; i < nMeses; i++) {
      const v = values[i] || 0;
      const cls = v > 0 ? 'dre-val-pos' : v < 0 ? 'dre-val-neg' : '';
      html += `<td class="${cls}">${v !== 0 ? fmtBRL(v) : '—'}</td>`;
    }
    // total e média
    const tot = values[nMeses] || 0;
    const med = values[nMeses+1] || 0;
    const tcls = tot > 0 ? 'dre-val-pos' : tot < 0 ? 'dre-val-neg' : '';
    html += `<td class="${tcls}" style="font-weight:700;">${tot !== 0 ? fmtBRL(tot) : '—'}</td>`;
    html += `<td style="color:var(--text-light);">${med !== 0 ? fmtBRL(med) : '—'}</td>`;
    return html;
  }

  // ──────────────────────────────────────────────
  //  ABA 3: RELATÓRIO
  // ──────────────────────────────────────────────
  function renderCharts() {
    if (!fin.lancamentos.length) return;
    const ano = parseInt(document.getElementById('fin-chart-ano').value);
    const dados = fin.lancamentos.filter(l => l.ano === ano);
    
    const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
                   'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    
    const rendas = meses.map(m => dados.filter(l => l.mes === m && l.valor > 0).reduce((s,l) => s+l.valor, 0));
    const despesas = meses.map(m => Math.abs(dados.filter(l => l.mes === m && l.valor < 0).reduce((s,l) => s+l.valor, 0)));
    
    // KPIs — mês atual ou último com dados
    const mesAtual = document.getElementById('fin-rel-mes').value;
    const dadosMes = dados.filter(l => l.mes === mesAtual);
    const rendaMes = dadosMes.filter(l => l.valor > 0).reduce((s,l) => s+l.valor, 0);
    const despMes = Math.abs(dadosMes.filter(l => l.valor < 0).reduce((s,l) => s+l.valor, 0));
    const resMes = rendaMes - despMes;
    const totalRes = rendas.reduce((s,v,i) => s + v - despesas[i], 0);
    const mesesComDados = rendas.filter(v => v > 0).length || 1;
    
    document.getElementById('fin-kpi-renda').textContent = fmtBRL(rendaMes);
    document.getElementById('fin-kpi-renda-label').textContent = mesAtual + ' / ' + ano;
    document.getElementById('fin-kpi-despesa').textContent = fmtBRL(despMes);
    document.getElementById('fin-kpi-despesa-label').textContent = mesAtual + ' / ' + ano;
    document.getElementById('fin-kpi-resultado').textContent = fmtBRL(resMes);
    document.getElementById('fin-kpi-resultado').className = 'stat-value ' + (resMes >= 0 ? 'val-pos' : 'val-neg');
    document.getElementById('fin-kpi-resultado-label').textContent = resMes >= 0 ? '▲ Superávit' : '▼ Déficit';
    document.getElementById('fin-kpi-media').textContent = fmtBRL(totalRes / mesesComDados);
    
    // Chart.js — barra
    if (typeof Chart === 'undefined') {
      loadChartJS(renderCharts);
      return;
    }
    
    const ctxBar = document.getElementById('fin-chart-bar').getContext('2d');
    if (fin.chartBar) fin.chartBar.destroy();
    fin.chartBar = new Chart(ctxBar, {
      type: 'bar',
      data: {
        labels: meses.map(m => m.substring(0,3)),
        datasets: [
          { label: 'Rendas', data: rendas, backgroundColor: 'rgba(16,185,129,0.7)', borderColor: '#10b981', borderWidth: 1, borderRadius: 4 },
          { label: 'Despesas', data: despesas, backgroundColor: 'rgba(239,68,68,0.7)', borderColor: '#ef4444', borderWidth: 1, borderRadius: 4 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'top', labels: { font: { family: 'Montserrat', size: 11 } } } },
        scales: {
          y: { beginAtZero: true, ticks: { callback: v => 'R$' + (v/1000).toFixed(0)+'k', font: { family: 'Montserrat', size: 10 } } },
          x: { ticks: { font: { family: 'Montserrat', size: 10 } } }
        }
      }
    });
    
    // Chart donut — despesas por grupo
    const grupos = {};
    dados.filter(l => l.valor < 0).forEach(l => {
      const g = getGrupo(l.referencia);
      grupos[g] = (grupos[g] || 0) + Math.abs(l.valor);
    });
    const gLabels = Object.keys(grupos);
    const gValues = gLabels.map(k => grupos[k]);
    const colors = ['#0f3d57','#2e6b8e','#629ec1','#10b981','#ef4444','#f59e0b','#8b5cf6','#ec4899','#6b7280','#14b8a6'];
    
    const ctxDonut = document.getElementById('fin-chart-donut').getContext('2d');
    if (fin.chartDonut) fin.chartDonut.destroy();
    fin.chartDonut = new Chart(ctxDonut, {
      type: 'doughnut',
      data: {
        labels: gLabels,
        datasets: [{ data: gValues, backgroundColor: colors.slice(0, gLabels.length), borderWidth: 2, borderColor: '#fff' }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { font: { family: 'Montserrat', size: 10 }, boxWidth: 12, padding: 8 } },
          tooltip: { callbacks: { label: ctx => ` ${ctx.label}: ${fmtBRL(ctx.raw)}` } }
        }
      }
    });
    
    renderRelatorioMes();
  }

  function renderRelatorioMes() {
    const mes = document.getElementById('fin-rel-mes').value;
    const ano = parseInt(document.getElementById('fin-chart-ano').value);
    const dados = fin.lancamentos.filter(l => l.mes === mes && l.ano === ano && l.valor < 0);
    
    // Agrupa por categoria
    const cats = {};
    dados.forEach(l => {
      cats[l.referencia] = (cats[l.referencia] || 0) + Math.abs(l.valor);
    });
    const sorted = Object.entries(cats).sort((a,b) => b[1]-a[1]);
    const maxVal = sorted.length ? sorted[0][1] : 1;
    
    const container = document.getElementById('fin-rel-breakdown');
    if (!sorted.length) {
      container.innerHTML = '<div class="empty-state">Sem despesas lançadas para ' + mes + ' / ' + ano + '.</div>';
      return;
    }
    
    container.innerHTML = sorted.map(([cat, val]) => {
      const pct = (val / maxVal * 100).toFixed(1);
      const grupo = getGrupo(cat);
      return `<div class="fin-cat-row">
        <div class="fin-cat-name">${cat}<br><small style="color:var(--text-light);font-size:10px;">${grupo}</small></div>
        <div class="fin-cat-bar-track"><div class="fin-cat-bar-fill" style="width:${pct}%"></div></div>
        <div class="fin-cat-val">${fmtBRL(val)}</div>
      </div>`;
    }).join('');
  }

  function loadChartJS(callback) {
    if (document.querySelector('script[src*="chart.js"]')) return;
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js';
    s.onload = callback;
    document.head.appendChild(s);
  }

  // Tab switcher
  function switchFinTab(tab) {
    document.querySelectorAll('[data-fin-tab]').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content[id^="fin-tab-"]').forEach(c => c.classList.remove('active'));
    document.querySelector(`[data-fin-tab="${tab}"]`).classList.add('active');
    document.getElementById('fin-tab-' + tab).classList.add('active');
    
    if (tab === 'relatorio' && fin.lancamentos.length) {
      loadChartJS(() => renderCharts());
      if (typeof Chart !== 'undefined') renderCharts();
    }
  }

  // ──────────────────────────────────────────────
  //  HELPERS
  // ──────────────────────────────────────────────
  function fmtBRL(v) {
    if (v === null || v === undefined || isNaN(v)) return '—';
    return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v);
  }

  function parseNum(v) {
    if (!v) return 0;
    if (typeof v === 'number') return v;
    const s = v.toString().replace(/[R$\s]/g,'').replace(',','.');
    return parseFloat(s) || 0;
  }

  function formatDate(d) {
    if (!d) return '—';
    if (typeof d === 'string' && d.includes('/')) return d;
    try {
      const dt = new Date(d);
      if (isNaN(dt)) return d;
      return dt.toLocaleDateString('pt-BR');
    } catch { return d; }
  }

  // Expõe financeiroSheetId para ser setado após login
  // O integrador deve adicionar: window.financeiroSheetId = client.financeiro_sheet_id
  </script>
